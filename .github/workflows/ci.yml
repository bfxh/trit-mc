name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release

  stress:
    name: runtime + chaos (repeat)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 单线程跑全量，暴露依赖执行顺序的问题；再以默认并行度跑端到端管线。
      - name: all targets, serial
        run: cargo test --locked --all-targets -- --test-threads=1
      - name: pipeline concurrency (5 rounds)
        run: |
          set -e
          for round in 1 2 3 4 5; do
            echo "::group::pipeline round $round"
            cargo test --locked --test pipeline
            echo "::endgroup::"
          done
